name: frontend

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @budgetflow/web build

  # Full stack in Docker, then the browser suite (incl. axe WCAG 2.2 AA checks).
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WEB_PORT: "3300"
      SIGNUP_RATE_TOKENS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable
      - name: Start the stack
        run: docker compose -f infra/docker-compose.yml --profile apps up -d --build --wait
      - name: Install browsers
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @budgetflow/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: frontend/apps/web
        env:
          E2E_BASE_URL: http://localhost:3300
          CI: "true"
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/apps/web/playwright-report
      - name: Service logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml --profile apps logs --no-color | tail -500
