name: release

# Push a tag like v1.0.0 on a green main commit. All tests run again, then every image is pushed to GHCR
# as ghcr.io/jiten-jtb/budgetflow-<name>:<tag>. Dokploy deploys a tag by setting IMAGE_TAG (infra/deploy/README.md).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v1.0.0-rc.1)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    uses: ./.github/workflows/backend.yml
  frontend:
    uses: ./.github/workflows/frontend.yml

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: identity-service,     context: backend,  dockerfile: backend/services/identity-service/Dockerfile }
          - { name: account-service,      context: backend,  dockerfile: backend/services/account-service/Dockerfile }
          - { name: transaction-service,  context: backend,  dockerfile: backend/services/transaction-service/Dockerfile }
          - { name: budget-service,       context: backend,  dockerfile: backend/services/budget-service/Dockerfile }
          - { name: orchestrator-service, context: backend,  dockerfile: backend/services/orchestrator-service/Dockerfile }
          - { name: api-gateway,          context: backend,  dockerfile: backend/services/api-gateway/Dockerfile }
          - { name: web,                  context: frontend, dockerfile: frontend/apps/web/Dockerfile }
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject malformed tags
        run: echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/jiten-jtb/budgetflow-${{ matrix.name }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/Jiten-JTB/BudgetFlow
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
