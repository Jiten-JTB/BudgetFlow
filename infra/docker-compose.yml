# Local development infrastructure. Usage: docker compose -f infra/docker-compose.yml --env-file infra/.env up -d
name: budgetflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-budgetflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin_dev_password}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-service_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-budgetflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbit_dev_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_password}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-redis_dev_password} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Catches every email locally (verification links); web UI and API on ${MAILPIT_UI_PORT:-8025}.
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # --- Application services (opt-in): docker compose --profile apps up -d --build -------------------
  identity-service:
    profiles: [apps]
    build:
      context: ../backend
      dockerfile: services/identity-service/Dockerfile
    image: budgetflow/identity-service:dev
    environment:
      SPRING_PROFILES_ACTIVE: local                     # ephemeral signing key + dev client secret
      IDENTITY_ISSUER: http://localhost:${IDENTITY_PORT:-9000}
      IDENTITY_WEB_REDIRECT_URIS: http://localhost:${WEB_PORT:-3000}/api/auth/callback
      IDENTITY_WEB_POST_LOGOUT_URIS: http://localhost:${WEB_PORT:-3000}/signed-out
      IDENTITY_WEB_SIGNUP_URL: http://localhost:${WEB_PORT:-3000}/signup
      IDENTITY_WEB_VERIFY_EMAIL_URL: http://localhost:${WEB_PORT:-3000}/verify-email
      IDENTITY_MAIL_FROM: Budget Flow <no-reply@budgetflow.local>
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/identity_db
      IDENTITY_DB_USER: identity_svc
      IDENTITY_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-service_dev_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-budgetflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit_dev_password}
    ports:
      - "${IDENTITY_PORT:-9000}:9000"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_started }

  account-service:
    profiles: [apps]
    build:
      context: ../backend
      dockerfile: services/account-service/Dockerfile
    image: budgetflow/account-service:dev
    environment:
      ACCOUNT_DB_URL: jdbc:postgresql://postgres:5432/account_db
      ACCOUNT_DB_USER: account_svc
      ACCOUNT_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-service_dev_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-budgetflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit_dev_password}
      IDENTITY_JWKS_URI: http://identity-service:9000/oauth2/jwks
      IDENTITY_ISSUER: http://localhost:${IDENTITY_PORT:-9000}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  transaction-service:
    profiles: [apps]
    build:
      context: ../backend
      dockerfile: services/transaction-service/Dockerfile
    image: budgetflow/transaction-service:dev
    environment:
      TRANSACTION_DB_URL: jdbc:postgresql://postgres:5432/transaction_db
      TRANSACTION_DB_USER: transaction_svc
      TRANSACTION_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-service_dev_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-budgetflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit_dev_password}
      IDENTITY_JWKS_URI: http://identity-service:9000/oauth2/jwks
      IDENTITY_ISSUER: http://localhost:${IDENTITY_PORT:-9000}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  budget-service:
    profiles: [apps]
    build:
      context: ../backend
      dockerfile: services/budget-service/Dockerfile
    image: budgetflow/budget-service:dev
    environment:
      BUDGET_DB_URL: jdbc:postgresql://postgres:5432/budget_db
      BUDGET_DB_USER: budget_svc
      BUDGET_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-service_dev_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-budgetflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit_dev_password}
      IDENTITY_JWKS_URI: http://identity-service:9000/oauth2/jwks
      IDENTITY_ISSUER: http://localhost:${IDENTITY_PORT:-9000}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  orchestrator-service:
    profiles: [apps]
    build:
      context: ../backend
      dockerfile: services/orchestrator-service/Dockerfile
    image: budgetflow/orchestrator-service:dev
    environment:
      ORCHESTRATOR_DB_URL: jdbc:postgresql://postgres:5432/orchestrator_db
      ORCHESTRATOR_DB_USER: orchestrator_svc
      ORCHESTRATOR_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-service_dev_password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-budgetflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-rabbit_dev_password}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  api-gateway:
    profiles: [apps]
    build:
      context: ../backend
      dockerfile: services/api-gateway/Dockerfile
    image: budgetflow/api-gateway:dev
    environment:
      IDENTITY_URI: http://identity-service:9000
      ACCOUNT_URI: http://account-service:8110
      TRANSACTION_URI: http://transaction-service:8120
      BUDGET_URI: http://budget-service:8130
      IDENTITY_JWKS_URI: http://identity-service:9000/oauth2/jwks
      IDENTITY_ISSUER: http://localhost:${IDENTITY_PORT:-9000}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
      GATEWAY_CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Sign-up limit: tokens per sign-up out of a 60-token bucket refilling 1/s (12 = 5 per minute).
      # E2E runs set SIGNUP_RATE_TOKENS=1 because every test signs up a fresh user from the same IP.
      BUDGETFLOW_GATEWAY_RATE_LIMIT_REGISTRATION_REQUESTED_TOKENS: ${SIGNUP_RATE_TOKENS:-12}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      redis: { condition: service_healthy }
      identity-service: { condition: service_healthy }
      account-service: { condition: service_healthy }
      transaction-service: { condition: service_healthy }
      budget-service: { condition: service_healthy }

  web:
    profiles: [apps]
    build:
      context: ../frontend
      dockerfile: apps/web/Dockerfile
    image: budgetflow/web:dev
    environment:
      AUTH_ISSUER: http://localhost:${IDENTITY_PORT:-9000}
      AUTH_INTERNAL_URL: http://identity-service:9000      # token exchange stays on the internal network
      AUTH_CLIENT_ID: budgetflow-web
      AUTH_CLIENT_SECRET: local-dev-web-secret
      APP_URL: http://localhost:${WEB_PORT:-3000}
      API_URL: http://api-gateway:8080
      SESSION_SECRET: ${WEB_SESSION_SECRET:-local-dev-session-secret-change-me-0123456789}
      SECURE_COOKIES: "false"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api-gateway: { condition: service_healthy }

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
