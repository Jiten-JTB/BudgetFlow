# Budget Flow production stack for Dokploy (Compose service). Runbook: infra/deploy/README.md
# - Images are built by .github/workflows/release.yml and pulled from GHCR; nothing builds on the VPS.
# - Only web, api-gateway and identity-service join the shared dokploy-network (Traefik). Everything else,
#   including all service-to-service calls, stays on the private "internal" network under budgetflow-* aliases,
#   so names never clash with other apps on the shared panel.
# - No host ports. Management ports (health, Prometheus) are never routed.

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-jvm: &jvm
  <<: *defaults
  deploy:
    resources:
      limits: { memory: 512m, cpus: "1.0" }   # heap = 75% (MaxRAMPercentage in the image)

x-rabbit: &rabbit
  RABBITMQ_HOST: budgetflow-rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:-budgetflow}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}

x-issuer: &issuer
  IDENTITY_JWKS_URI: http://budgetflow-identity:9000/oauth2/jwks
  IDENTITY_ISSUER: https://budgetflow-auth.jitenjtb.com

x-backend-deps: &backend-deps
  postgres: { condition: service_healthy }
  rabbitmq: { condition: service_healthy }

name: budgetflow

services:
  # --- Data ------------------------------------------------------------------------------------------
  postgres:
    <<: *defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-budgetflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?set ACCOUNT_DB_PASSWORD}
      TRANSACTION_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD:?set TRANSACTION_DB_PASSWORD}
      BUDGET_DB_PASSWORD: ${BUDGET_DB_PASSWORD:?set BUDGET_DB_PASSWORD}
      ORCHESTRATOR_DB_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD:?set ORCHESTRATOR_DB_PASSWORD}
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/01-create-service-databases.sh
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      internal: { aliases: [budgetflow-postgres] }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 768m }

  postgres-backup:
    <<: *defaults
    image: postgres:17-alpine
    environment:
      PGHOST: budgetflow-postgres
      PGUSER: ${POSTGRES_ADMIN_USER:-budgetflow_admin}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["/bin/sh", "/backup.sh"]
    configs:
      - source: postgres-backup
        target: /backup.sh
    volumes:
      - postgres-backups:/backups
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 128m }

  rabbitmq:
    <<: *defaults
    image: rabbitmq:4-alpine
    hostname: budgetflow-rabbitmq        # node name is tied to the hostname; keep it stable across recreates
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-budgetflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      internal: { aliases: [budgetflow-rabbitmq] }
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 512m }

  redis:
    <<: *defaults
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes",
              "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      internal: { aliases: [budgetflow-redis] }
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 128m }

  # --- Backend ---------------------------------------------------------------------------------------
  identity-service:
    <<: *jvm
    image: ghcr.io/jiten-jtb/budgetflow-identity-service:${IMAGE_TAG:?set IMAGE_TAG to a release tag}
    environment:
      <<: *rabbit
      IDENTITY_ISSUER: https://budgetflow-auth.jitenjtb.com
      IDENTITY_SIGNING_KEY_ID: ${IDENTITY_SIGNING_KEY_ID:?set IDENTITY_SIGNING_KEY_ID}
      IDENTITY_SIGNING_KEY_PEM: ${IDENTITY_SIGNING_KEY_PEM:?set IDENTITY_SIGNING_KEY_PEM}
      IDENTITY_WEB_CLIENT_SECRET: ${IDENTITY_WEB_CLIENT_SECRET:?set IDENTITY_WEB_CLIENT_SECRET}
      IDENTITY_WEB_REDIRECT_URIS: https://budgetflow.jitenjtb.com/api/auth/callback
      IDENTITY_WEB_POST_LOGOUT_URIS: https://budgetflow.jitenjtb.com/signed-out
      IDENTITY_WEB_SIGNUP_URL: https://budgetflow.jitenjtb.com/signup
      IDENTITY_SECURE_COOKIES: "true"
      IDENTITY_DB_URL: jdbc:postgresql://budgetflow-postgres:5432/identity_db
      IDENTITY_DB_USER: identity_svc
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD}
    networks:
      internal: { aliases: [budgetflow-identity] }
      dokploy-network: {}
    depends_on: *backend-deps
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      # Path allow-list (architecture.md §9): sign-in, OAuth2/OIDC and the sign-in page's own assets only.
      # /api/** is never served here; it goes through the gateway and its rate limits.
      traefik.http.routers.budgetflow-auth.rule: &auth-rule >-
        Host(`budgetflow-auth.jitenjtb.com`) && (PathPrefix(`/oauth2/`) || PathPrefix(`/.well-known/`) ||
        PathPrefix(`/connect/`) || Path(`/userinfo`) || Path(`/login`) || Path(`/logout`) || Path(`/error`) ||
        PathPrefix(`/css/`) || PathPrefix(`/fonts/`))
      traefik.http.routers.budgetflow-auth.entrypoints: web
      traefik.http.routers.budgetflow-auth.middlewares: redirect-to-https@file
      traefik.http.routers.budgetflow-auth.service: budgetflow-auth
      traefik.http.routers.budgetflow-auth-secure.rule: *auth-rule
      traefik.http.routers.budgetflow-auth-secure.entrypoints: websecure
      traefik.http.routers.budgetflow-auth-secure.tls.certresolver: letsencrypt
      traefik.http.routers.budgetflow-auth-secure.middlewares: budgetflow-hsts
      traefik.http.routers.budgetflow-auth-secure.service: budgetflow-auth
      traefik.http.middlewares.budgetflow-hsts.headers.stsSeconds: "31536000"
      traefik.http.services.budgetflow-auth.loadbalancer.server.port: "9000"

  account-service:
    <<: *jvm
    image: ghcr.io/jiten-jtb/budgetflow-account-service:${IMAGE_TAG:?set IMAGE_TAG to a release tag}
    environment:
      <<: [*rabbit, *issuer]
      ACCOUNT_DB_URL: jdbc:postgresql://budgetflow-postgres:5432/account_db
      ACCOUNT_DB_USER: account_svc
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?set ACCOUNT_DB_PASSWORD}
    networks:
      internal: { aliases: [budgetflow-account] }
    depends_on: *backend-deps

  transaction-service:
    <<: *jvm
    image: ghcr.io/jiten-jtb/budgetflow-transaction-service:${IMAGE_TAG:?set IMAGE_TAG to a release tag}
    environment:
      <<: [*rabbit, *issuer]
      TRANSACTION_DB_URL: jdbc:postgresql://budgetflow-postgres:5432/transaction_db
      TRANSACTION_DB_USER: transaction_svc
      TRANSACTION_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD:?set TRANSACTION_DB_PASSWORD}
    networks:
      internal: { aliases: [budgetflow-transaction] }
    depends_on: *backend-deps

  budget-service:
    <<: *jvm
    image: ghcr.io/jiten-jtb/budgetflow-budget-service:${IMAGE_TAG:?set IMAGE_TAG to a release tag}
    environment:
      <<: [*rabbit, *issuer]
      BUDGET_DB_URL: jdbc:postgresql://budgetflow-postgres:5432/budget_db
      BUDGET_DB_USER: budget_svc
      BUDGET_DB_PASSWORD: ${BUDGET_DB_PASSWORD:?set BUDGET_DB_PASSWORD}
    networks:
      internal: { aliases: [budgetflow-budget] }
    depends_on: *backend-deps

  orchestrator-service:
    <<: *jvm
    image: ghcr.io/jiten-jtb/budgetflow-orchestrator-service:${IMAGE_TAG:?set IMAGE_TAG to a release tag}
    environment:
      <<: *rabbit
      ORCHESTRATOR_DB_URL: jdbc:postgresql://budgetflow-postgres:5432/orchestrator_db
      ORCHESTRATOR_DB_USER: orchestrator_svc
      ORCHESTRATOR_DB_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD:?set ORCHESTRATOR_DB_PASSWORD}
    networks: [internal]
    depends_on: *backend-deps

  api-gateway:
    <<: *jvm
    image: ghcr.io/jiten-jtb/budgetflow-api-gateway:${IMAGE_TAG:?set IMAGE_TAG to a release tag}
    environment:
      <<: *issuer
      IDENTITY_URI: http://budgetflow-identity:9000
      ACCOUNT_URI: http://budgetflow-account:8110
      TRANSACTION_URI: http://budgetflow-transaction:8120
      BUDGET_URI: http://budgetflow-budget:8130
      REDIS_HOST: budgetflow-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      GATEWAY_CORS_ALLOWED_ORIGINS: https://budgetflow.jitenjtb.com
    networks:
      internal: { aliases: [budgetflow-gateway] }
      dokploy-network: {}
    depends_on:
      redis: { condition: service_healthy }
      identity-service: { condition: service_healthy }
      account-service: { condition: service_healthy }
      transaction-service: { condition: service_healthy }
      budget-service: { condition: service_healthy }
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.budgetflow-api.rule: Host(`budgetflow-api.jitenjtb.com`)
      traefik.http.routers.budgetflow-api.entrypoints: web
      traefik.http.routers.budgetflow-api.middlewares: redirect-to-https@file
      traefik.http.routers.budgetflow-api.service: budgetflow-api
      traefik.http.routers.budgetflow-api-secure.rule: Host(`budgetflow-api.jitenjtb.com`)
      traefik.http.routers.budgetflow-api-secure.entrypoints: websecure
      traefik.http.routers.budgetflow-api-secure.tls.certresolver: letsencrypt
      traefik.http.routers.budgetflow-api-secure.middlewares: budgetflow-hsts
      traefik.http.routers.budgetflow-api-secure.service: budgetflow-api
      traefik.http.middlewares.budgetflow-hsts.headers.stsSeconds: "31536000"
      traefik.http.services.budgetflow-api.loadbalancer.server.port: "8080"

  # --- Web -------------------------------------------------------------------------------------------
  web:
    <<: *defaults
    image: ghcr.io/jiten-jtb/budgetflow-web:${IMAGE_TAG:?set IMAGE_TAG to a release tag}
    environment:
      AUTH_ISSUER: https://budgetflow-auth.jitenjtb.com
      AUTH_INTERNAL_URL: http://budgetflow-identity:9000   # token exchange stays on the internal network
      AUTH_CLIENT_ID: budgetflow-web
      AUTH_CLIENT_SECRET: ${IDENTITY_WEB_CLIENT_SECRET:?set IDENTITY_WEB_CLIENT_SECRET}
      APP_URL: https://budgetflow.jitenjtb.com
      API_URL: http://budgetflow-gateway:8080
      SESSION_SECRET: ${WEB_SESSION_SECRET:?set WEB_SESSION_SECRET}
      SECURE_COOKIES: "true"
    networks:
      internal: {}
      dokploy-network: {}
    depends_on:
      api-gateway: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 384m, cpus: "1.0" }
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.budgetflow-web.rule: Host(`budgetflow.jitenjtb.com`)
      traefik.http.routers.budgetflow-web.entrypoints: web
      traefik.http.routers.budgetflow-web.middlewares: redirect-to-https@file
      traefik.http.routers.budgetflow-web.service: budgetflow-web
      traefik.http.routers.budgetflow-web-secure.rule: Host(`budgetflow.jitenjtb.com`)
      traefik.http.routers.budgetflow-web-secure.entrypoints: websecure
      traefik.http.routers.budgetflow-web-secure.tls.certresolver: letsencrypt
      traefik.http.routers.budgetflow-web-secure.middlewares: budgetflow-hsts
      traefik.http.routers.budgetflow-web-secure.service: budgetflow-web
      traefik.http.middlewares.budgetflow-hsts.headers.stsSeconds: "31536000"
      traefik.http.services.budgetflow-web.loadbalancer.server.port: "3000"

configs:
  # Database per service, one role each with its own password. Runs only on the first start (empty volume).
  postgres-init:
    content: |
      #!/bin/sh
      set -eu
      for svc in identity account transaction budget orchestrator; do
        pw="$$(printenv "$$(echo "$$svc" | tr a-z A-Z)_DB_PASSWORD")"
        psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname postgres <<SQL
      CREATE ROLE $${svc}_svc LOGIN PASSWORD '$${pw}';
      CREATE DATABASE $${svc}_db OWNER $${svc}_svc;
      REVOKE ALL ON DATABASE $${svc}_db FROM PUBLIC;
      SQL
      done
  # Daily custom-format dump per database plus roles; old dumps pruned after RETENTION_DAYS.
  postgres-backup:
    content: |
      set -u
      while :; do
        ts="$$(date -u +%Y%m%dT%H%MZ)"
        pg_dumpall --globals-only --no-role-passwords -f "/backups/globals-$$ts.sql" || echo "backup: globals failed"
        for db in identity_db account_db transaction_db budget_db orchestrator_db; do
          if pg_dump -Fc -f "/backups/$$db-$$ts.dump.part" "$$db"; then
            mv "/backups/$$db-$$ts.dump.part" "/backups/$$db-$$ts.dump"
          else
            echo "backup: $$db failed"; rm -f "/backups/$$db-$$ts.dump.part"
          fi
        done
        find /backups -type f -mtime +"$$RETENTION_DAYS" -delete
        echo "backup: done $$ts"
        sleep 86400
      done

networks:
  internal: {}
  dokploy-network:
    external: true

volumes:
  postgres-data:
  postgres-backups:
  rabbitmq-data:
  redis-data:
