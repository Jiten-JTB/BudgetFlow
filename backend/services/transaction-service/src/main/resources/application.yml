spring:
  application:
    name: transaction-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${TRANSACTION_DB_URL:jdbc:postgresql://localhost:5432/transaction_db}
    username: ${TRANSACTION_DB_USER:transaction_svc}
    password: ${TRANSACTION_DB_PASSWORD:service_dev_password}
    hikari:
      maximum-pool-size: ${TRANSACTION_DB_POOL_SIZE:10}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:budgetflow}
    password: ${RABBITMQ_PASSWORD:rabbit_dev_password}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keys come from identity-service over the internal network; iss must be the public issuer.
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:9000/oauth2/jwks}
          issuer-uri: ${IDENTITY_ISSUER:http://localhost:9000}

server:
  port: ${TRANSACTION_PORT:8120}
  shutdown: graceful

management:
  server:
    port: ${TRANSACTION_MANAGEMENT_PORT:8121}  # internal only
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
