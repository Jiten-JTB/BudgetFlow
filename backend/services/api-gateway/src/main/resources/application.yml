spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_dev_password}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Anonymous registration: strict per-IP limit (defaults: 5/min, burst 5).
            - id: identity-registration
              uri: ${budgetflow.gateway.identity-uri}
              order: -1
              predicates:
                - Path=/api/v1/users
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientIpKeyResolver}"
                    redis-rate-limiter.replenishRate: ${budgetflow.gateway.rate-limit.registration.replenish-rate:1}
                    redis-rate-limiter.burstCapacity: ${budgetflow.gateway.rate-limit.registration.burst-capacity:60}
                    redis-rate-limiter.requestedTokens: ${budgetflow.gateway.rate-limit.registration.requested-tokens:12}
            - id: identity-users
              uri: ${budgetflow.gateway.identity-uri}
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalKeyResolver}"
                    redis-rate-limiter.replenishRate: ${budgetflow.gateway.rate-limit.default.replenish-rate:10}
                    redis-rate-limiter.burstCapacity: ${budgetflow.gateway.rate-limit.default.burst-capacity:20}

server:
  port: ${GATEWAY_PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  server:
    port: ${GATEWAY_MANAGEMENT_PORT:8081}   # internal only; never routed by Traefik
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

budgetflow:
  gateway:
    identity-uri: ${IDENTITY_URI:http://localhost:9000}
    jwt:
      issuer: ${IDENTITY_ISSUER:http://localhost:9000}
      jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:9000/oauth2/jwks}
    cors:
      allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000}
