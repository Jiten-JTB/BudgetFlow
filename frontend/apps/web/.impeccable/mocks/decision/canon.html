<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Budget Flow · Category standard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--card:#fff;--ink:#0F172A;--mute:#64748B;--blue:#2563EB;--green:#16A34A;--red:#DC2626;--line:#E2E8F0}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:Inter,sans-serif;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px}
header nav{display:flex;gap:28px;color:var(--mute);font-size:15px}header nav .on{color:var(--blue);font-weight:600}
.add{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-weight:600;font-family:inherit}
main{padding:32px 40px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.k small{color:var(--mute);font-size:14px}.k b{display:block;font-size:30px;margin-top:8px}
.k i{font-style:normal;font-size:13px;color:var(--green)}
.chart{grid-column:1/3;height:360px}.tbl{grid-column:3/5;height:360px}
.donut{width:200px;height:200px;border-radius:50%;margin:30px auto;background:conic-gradient(var(--blue) 0 38%,var(--green) 0 60%,#F59E0B 0 78%,var(--red) 0 100%)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}td{padding:12px 0;border-top:1px solid var(--line)}td.n{text-align:right;font-weight:600}
</style></head><body>
<header><b>Budget Flow</b><nav><span class="on">Dashboard</span><span>Transactions</span><span>Accounts</span><span>Budgets</span></nav><button class="add">Add transaction</button></header>
<main>
<div class="k"><small>Total balance</small><b>₹6,42,915</b><i>+4.2% vs last month</i></div>
<div class="k"><small>Income</small><b>₹1,24,500</b></div>
<div class="k"><small>Expenses</small><b>₹86,320</b></div>
<div class="k"><small>Savings rate</small><b>30.7%</b></div>
<div class="k chart"><small>Spending by category</small><div class="donut"></div></div>
<div class="k tbl"><small>Recent transactions</small><table>
<tr><td>Swiggy dinner</td><td class="n" style="color:var(--red)">−₹640</td></tr><tr><td>Acme Corp salary</td><td class="n" style="color:var(--green)">+₹1,10,000</td></tr>
<tr><td>BigBasket groceries</td><td class="n" style="color:var(--red)">−₹2,315</td></tr><tr><td>Freelance: Lumen Studio</td><td class="n" style="color:var(--green)">+₹14,500</td></tr></table></div>
</main></body></html>
